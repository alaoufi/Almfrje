<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة — المفارجي</title>
    <meta http-equiv="refresh" content="0; url=/almfrje/index.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 6rem; color: #e94560; margin-bottom: 10px; }
        h2 { font-size: 1.8rem; margin-bottom: 15px; }
        p { font-size: 1.1rem; color: #a0a0a0; margin-bottom: 30px; line-height: 1.8; }
        .loader {
            width: 50px; height: 50px;
            border: 4px solid rgba(233, 69, 96, 0.2);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a {
            display: inline-block; padding: 12px 30px;
            background: #e94560; color: #fff;
            text-decoration: none; border-radius: 8px;
            font-size: 1rem; transition: background 0.3s;
        }
        a:hover { background: #c73e54; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>الصفحة غير موجودة</h2>
        <div class="loader"></div>
        <p>جاري تحويلك إلى تطبيق المفارجي...<br>إذا لم يتم التحويل تلقائياً، اضغط على الزر أدناه.</p>
        <a href="/almfrje/index.html">الذهاب إلى التطبيق</a>
    </div>
    <script>
        var target = '/almfrje/index.html' + window.location.search + window.location.hash;
        window.location.replace(target);
    </script>
</body>
</html>
