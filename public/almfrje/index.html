<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4338CA" />
  <!-- منع التخزين المؤقّت للمستند نهائياً -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>قاعدة بيانات قبيلة المفارجة</title>
  <link rel="icon" href="/almfrje/icon.svg" type="image/svg+xml" />
  <!-- تثبيت كتطبيق (PWA) -->
  <link rel="manifest" href="/almfrje/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/almfrje/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="المفارجة" />
  <!-- الأصول بإعادة تحقّق (ETag): تُحدَّث فور النشر وتُحمَّل بسرعة (304) إن لم تتغيّر -->
  <link rel="stylesheet" href="/almfrje/app.css">
</head>
<body>
  <!-- شاشة المصادقة -->
  <div id="auth" class="auth hidden"></div>

  <!-- التطبيق -->
  <div id="app" class="hidden">
    <header class="appbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="رجوع">‹</button>
      <h1 id="screenTitle">المفارجة</h1>
      <button id="shareBtn" class="icon-btn" aria-label="مشاركة الموقع" title="مشاركة الموقع">📤</button>
      <button id="guideBtn" class="icon-btn" aria-label="دليل الموقع" title="دليل الموقع">📖</button>
      <button id="refreshBtn" class="icon-btn" aria-label="تحديث" title="تحديث الصفحة">🔄</button>
      <button id="signoutBtn" class="icon-btn" aria-label="خروج" title="تسجيل الخروج">⎋</button>
    </header>
    <main id="view"></main>
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <div id="loading" class="loading">… جارٍ التحميل</div>
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- مكتبتا Excel و PDF ثقيلتان وتُستخدمان فقط في الاستيراد/التصدير،
       لذا تُحمّلان عند الطلب فقط (lazyLib في app.js) لتسريع البدء. -->
  <!-- احتياطي للاستضافة الثابتة (يُترك فارغاً عند الاعتماد على بيئة alaoufi.me) -->
  <script src="/almfrje/config.js"></script>
  <!-- الإعداد التلقائي من متغيّرات بيئة alaoufi.me (مسارٌ قابل للتخزين القصير لتسريع الفتح) -->
  <script src="/almfrje-config"></script>
  <script src="/almfrje/app.js"></script>
</body>
</html>
