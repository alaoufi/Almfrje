/* ══ CHAT WHATSAPP FINAL ══ */
:root{--wa-bg:#e5ddd5;--wa-me:#dcf8c6;--wa-other:#fff;--wa-time:#667781;}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:300px;background:#e5ddd5;border-radius:14px;overflow:hidden;border:1px solid #d1d7db;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.chat-header{background:#075e54;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.chat-header-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
.chat-header-name{font-weight:700;font-size:14px;}
.chat-header-status{font-size:11px;opacity:.75;}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 8px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;}
.chat-footer{padding:6px 8px;background:#f0f2f5;border-top:1px solid #d1d7db;display:flex;gap:7px;align-items:center;flex-shrink:0;}
.chat-footer input{flex:1;padding:10px 14px;border:none;border-radius:22px;font-family:Cairo,sans-serif;font-size:14px;outline:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.chat-send-btn{width:42px;height:42px;border-radius:50%;background:#075e54;border:none;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.msg-row{display:flex;margin-bottom:2px;padding:0 4px;}
.msg-row.me{justify-content:flex-start;}
.msg-row.other{justify-content:flex-end;}
.msg-bubble{max-width:80%;padding:7px 10px 5px;line-height:1.5;font-size:14px;word-break:break-word;}
.msg-row.me .msg-bubble{background:#fff;color:#111;border-radius:0 9px 9px 9px;box-shadow:0 1px 2px rgba(0,0,0,.13);}
.msg-row.other .msg-bubble{background:#dcf8c6;color:#111;border-radius:9px 0 9px 9px;box-shadow:0 1px 2px rgba(0,0,0,.13);}
.msg-time{font-size:10px;color:#667781;display:block;text-align:left;margin-top:1px;}
.msg-row.other .msg-time{color:#5d7a5e;}
.chat-date-sep{text-align:center;margin:8px 0;}
.chat-date-sep span{background:rgba(255,255,255,.8);color:#54656f;padding:3px 14px;border-radius:8px;font-size:11px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);}
/* ألوان الفقرات في الاستمارة */
.sub-field-card:nth-child(1){background:#f0f6ff;border-right:3px solid #bfdbfe;}
.sub-field-card:nth-child(2){background:#f0fdf4;border-right:3px solid #bbf7d0;}
.sub-field-card:nth-child(3){background:#fefce8;border-right:3px solid #fde68a;}
.sub-field-card:nth-child(4){background:#fff1f2;border-right:3px solid #fecdd3;}
.sub-field-card:nth-child(5){background:#f5f3ff;border-right:3px solid #ddd6fe;}
.sub-field-card:nth-child(6){background:#fff8ed;border-right:3px solid #fed7aa;}
.sub-field-card:nth-child(7){background:#f0f6ff;border-right:3px solid #bfdbfe;}
.sub-field-card:nth-child(8){background:#f0fdf4;border-right:3px solid #bbf7d0;}
.sub-field-card:nth-child(9){background:#fefce8;border-right:3px solid #fde68a;}
.sub-field-card:nth-child(10){background:#fff1f2;border-right:3px solid #fecdd3;}
.sub-field-label{font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.sub-field-val{font-size:14px;color:var(--text);padding-right:5px;}

/* ══ WHATSAPP CHAT ══ */
.wa-wrap{
  display:flex;flex-direction:column;
  height:calc(100vh - 195px);
  min-height:320px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #dde5f0;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
.wa-hdr{
  background:linear-gradient(135deg,#075e54,#128c7e);
  color:#fff;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.wa-hdr-back{
  background:none;border:none;color:#fff;
  font-size:20px;cursor:pointer;padding:0 6px 0 0;
  line-height:1;
}
.wa-hdr-av{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;flex-shrink:0;
}
.wa-hdr-info{flex:1;}
.wa-hdr-name{font-weight:700;font-size:14px;line-height:1.2;}
.wa-hdr-sub{font-size:11px;opacity:.8;}
.wa-msgs{
  flex:1;overflow-y:auto;
  padding:10px 8px;
  background:#e8ede9;
  display:flex;flex-direction:column;
  gap:0;
}
.wa-msgs::-webkit-scrollbar{width:3px;}

.wa-footer{
  padding:7px 8px;

async function api(m,p,b){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(TK)o.headers['Authorization']='Bearer '+TK;
  if(b)o.body=JSON.stringify(b);
  // long-poll requests يحتاجون timeout أطول (السيرفر يحتفظ بالاتصال حتى ٨ ثوانٍ)
  const isLongPoll=/long_poll=1/.test(p);
  const timeoutMs=isLongPoll?14000:8000;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),timeoutMs);
    o.signal=ctrl.signal;
    const r=await fetch(API+'/'+p,o);
    clearTimeout(tid);
    return await r.json();
  }catch(e){
    if(e.name==='AbortError')return{error:'انتهت مهلة الاتصال'};
    return{error:'خطأ في الاتصال: '+e.message};
  }
}

/**
 * تأكيد إجراء حساس (أرشفة / استعادة / حذف ...).
 * oConfirm(msg, onYes, {icon, yes, no, danger})
 *   - msg: نص السؤال
 *   - onYes: تُستدعى عند الموافقة
 *   - icon: رمز يظهر فوق النص (مثلاً '🗄️' '↩️' '🗑️')
 *   - yes/no: نص أزرار التأكيد والإلغاء
 *   - danger: true يجعل زر التأكيد أحمر
 */
/**
 * نافذة إدخال بنفس تصميم oConfirm/oAlert، تستبدل prompt() الافتراضية في المتصفّح.
 * oPrompt(title, opts).then(value | null)
 *   opts: {label, placeholder, default, ok, cancel, icon, type, danger}
 */
function oPrompt(title, opts){
  return new Promise(function(resolve){
    opts = opts || {};
    var icon = opts.icon || '✏️';
    var ok = opts.ok || 'موافق';
    var cancel = opts.cancel || 'إلغاء';
    var type = opts.type || 'text';
    var prev = document.getElementById('oprompt-ov'); if (prev) prev.remove();
    var ov = document.createElement('div');
    ov.id = 'oprompt-ov';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Cairo,sans-serif;animation:wcfade .12s ease-out';
    var box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:18px;padding:20px 18px 16px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)';
    var safeDef = String(opts.default==null?'':opts.default).replace(/"/g,'&quot;');
    var safePh  = String(opts.placeholder||'').replace(/"/g,'&quot;');
    box.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
      + '<div style="font-size:24px">'+icon+'</div>'
      + '<div style="font-weight:800;font-size:15px;color:#1e293b;flex:1">'+title+'</div>'
      + '</div>'
      + (opts.label ? '<div style="font-size:12.5px;color:#64748b;margin-bottom:8px;line-height:1.6">'+opts.label+'</div>' : '')
      + '<input id="oprompt-inp" type="'+type+'" value="'+safeDef+'" placeholder="'+safePh+'" '
      + 'style="width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:Cairo,sans-serif;font-size:14px;outline:none;background:#fff;box-sizing:border-box;color:#0f172a;direction:rtl">'
      + '<div style="display:flex;gap:8px;margin-top:14px">'
      +   '<button id="oprompt-no" style="flex:1;padding:11px;background:#f1f5f9;color:#475569;border:none;border-radius:10px;font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">'+cancel+'</button>'
      +   '<button id="oprompt-yes" style="flex:1;padding:11px;background:'+(opts.danger?'#ef4444':'#075e54')+';color:#fff;border:none;border-radius:10px;font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">'+ok+'</button>'
      + '</div>';
    ov.appendChild(box);
    document.body.appendChild(ov);
    var inp = document.getElementById('oprompt-inp');
    function close(val){ ov.remove(); document.removeEventListener('keydown', onKey); resolve(val); }
    function onKey(e){
      if (e.key === 'Escape') close(null);
      else if (e.key === 'Enter' && document.activeElement === inp){ e.preventDefault(); close((inp.value||'').trim()); }
    }
    document.addEventListener('keydown', onKey);
    document.getElementById('oprompt-no').addEventListener('click', function(){ close(null); });
    document.getElementById('oprompt-yes').addEventListener('click', function(){ close((inp.value||'').trim()); });
    ov.addEventListener('click', function(e){ if(e.target === ov) close(null); });
    setTimeout(function(){ inp && inp.focus(); inp && inp.select && inp.select(); }, 50);
  });
}

function oConfirm(msg, onYes, opts){
  opts = opts || {};
  var icon = opts.icon || '❓';
  var yes  = opts.yes  || 'موافق';
  var no   = opts.no   || 'إلغاء';
  var danger = !!opts.danger;
  var prev = document.getElementById('oconfirm-ov'); if (prev) prev.remove();
  var ov = document.createElement('div');
  ov.id = 'oconfirm-ov';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Cairo,sans-serif;animation:wcfade .12s ease-out';
  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:18px;padding:22px 18px 16px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center';
  box.innerHTML =
    '<div style="font-size:38px;margin-bottom:8px">'+icon+'</div>'
    + '<div style="font-size:15px;font-weight:700;color:#1e293b;line-height:1.5;margin-bottom:18px;white-space:pre-wrap">'+msg+'</div>'
    + '<div style="display:flex;gap:8px">'
    +   '<button id="oconfirm-no" style="flex:1;padding:11px;background:#f1f5f9;color:#475569;border:none;border-radius:10px;font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">'+no+'</button>'
    +   '<button id="oconfirm-yes" style="flex:1;padding:11px;background:'+(danger?'#ef4444':'#075e54')+';color:#fff;border:none;border-radius:10px;font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">'+yes+'</button>'
    + '</div>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  document.getElementById('oconfirm-no').addEventListener('click', close);
  ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
  document.getElementById('oconfirm-yes').addEventListener('click', function(){
    close();
    try { onYes && onYes(); } catch (e) { console.error('[oConfirm] callback error', e); }
  });
}

/**
 * تنبيه عام بنفس تصميم oConfirm، زر واحد فقط.
 * oAlert(msg, {icon, ok, danger, onClose})
 */
function oAlert(msg, opts){
  opts = opts || {};
  var icon = opts.icon || 'ℹ️';
  var ok   = opts.ok   || 'حسناً';
  var danger = !!opts.danger;
  var prev = document.getElementById('oalert-ov'); if (prev) prev.remove();
  var ov = document.createElement('div');
  ov.id = 'oalert-ov';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Cairo,sans-serif;animation:wcfade .12s ease-out';

  box.innerHTML =
    '<div style="font-size:38px;margin-bottom:8px">'+icon+'</div>'
    + '<div style="font-size:15px;font-weight:700;color:#1e293b;line-height:1.5;margin-bottom:18px;white-space:pre-wrap">'+msg+'</div>'
    + '<button id="oalert-ok" style="width:100%;padding:11px;background:'+(danger?'#ef4444':'#075e54')+';color:#fff;border:none;border-radius:10px;font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">'+ok+'</button>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  function close(){ ov.remove(); try{ opts.onClose && opts.onClose(); }catch(e){} }
  document.getElementById('oalert-ok').addEventListener('click', close);
  ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
}

function pH(){
  // فحص فوري لعدد الرسائل غير المقروءة لمسايرة آخر تغيير من السيرفر
  if(typeof window._checkUnread==='function') window._checkUnread();
  var today=new Date().toISOString().slice(0,10);
  var pendingSubs=(D.sub||[]).filter(function(x){return x.status==='pending'||x.status==='reviewing';}).length;
  // المواعيد التي مرّ تاريخها لا تُحسب كنشطة (تُعتبر فائتة)
  var pendingApts=(D.apt||[]).filter(function(x){return x.status==='pending' && (!x.date || x.date>=today);}).length;
  var activeApts=(D.apt||[]).filter(function(x){return (x.status==='pending'||x.status==='confirmed') && (!x.date || x.date>=today);}).length;
  // عدد الرسائل غير المقروءة — يُفضّل العدد الحيّ من /unread (يُحدَّث كل ١٥ث)
  // لأن D.cvs cache قد يكون قديماً ولا يعكس قراءة المستخدم الأخيرة.
  var unreadMsgs = (typeof window._unreadCount==='number')
    ? window._unreadCount
    : (D.cvs||[]).filter(function(x){return +x.unread>0;}).length;

  function actBox(count, lbl, icon, baseColor, baseBg, nav, sub, tab){
    var hot = count>0;
    var bg     = hot ? '#fef2f2'              : '#fff';
    var border = hot ? '#ef4444'              : 'var(--border)';
    var numCol = hot ? '#dc2626'              : 'var(--blue)';
    var iconBg = hot ? '#fee2e2'              : baseBg;
    var iconCo = hot ? '#dc2626'              : baseColor;
    var lblCol = hot ? '#991b1b'              : 'var(--mid)';
    var ring   = hot ? 'box-shadow:0 4px 14px rgba(239,68,68,.18),0 0 0 3px rgba(239,68,68,.08)' : 'box-shadow:0 1px 4px rgba(0,0,0,.05)';
    var badge  = hot ? '<div style="position:absolute;top:8px;left:8px;background:#dc2626;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:9px;letter-spacing:.5px">جديد</div>' : '';
    var tabAttr= tab ? ' data-tab="'+tab+'"' : '';
    return '<div data-nav="'+nav+'"'+tabAttr+' style="position:relative;background:'+bg+';border:2px solid '+border+';border-radius:14px;padding:16px 10px 12px;cursor:pointer;transition:transform .15s,box-shadow .18s;text-align:center;'+ring+'" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'\'">'
      +badge
      +'<div style="width:46px;height:46px;background:'+iconBg+';color:'+iconCo+';border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 8px">'+icon+'</div>'
      +'<div style="font-size:28px;font-weight:900;color:'+numCol+';line-height:1">'+count+'</div>'
      +'<div style="font-size:11.5px;color:'+lblCol+';font-weight:800;margin-top:5px;line-height:1.3">'+lbl+'</div>'
      +(sub?'<div style="font-size:10px;color:var(--light);margin-top:2px">'+sub+'</div>':'')
      +'</div>';
  }

  function _can(k){ return typeof hasAdminPerm !== 'function' || hasAdminPerm(k); }
  var canSections=_can('sections'), canChats=_can('chats'), canAppts=_can('appts'),
      canUsers=_can('users'), canArchive=_can('archive');

  var boxes = [];
  if(canSections) boxes.push(actBox(pendingSubs, 'استمارات للمراجعة', '📩', '#d97706', '#fef3c7', 'forms', '', 'review'));
  if(canChats)    boxes.push(actBox(unreadMsgs,  'رسائل جديدة',       '💬', '#15803d', '#dcfce7', 'chat',     ''));
  if(canAppts)    boxes.push(actBox(pendingApts, 'مواعيد للتأكيد',     '📅', '#2563b0', '#dbeafe', 'appointments', activeApts?(activeApts+' قائم'):''));
  var actionBoxes = boxes.length
    ? '<div style="display:grid;grid-template-columns:repeat('+boxes.length+',1fr);gap:9px;margin-bottom:14px">'+boxes.join('')+'</div>'
    : '';

  var statCells = [];
  // المحادثات بدل الأقسام (عدد المحادثات النشطة مع المراجعين)
  if(canChats) statCells.push('<div class="stat-c" data-nav="chat"><div style="font-size:18px;font-weight:800;color:var(--blue)">'+((D.cvs||[]).length)+'</div><div class="ps">محادثات</div></div>');
  if(canSections) statCells.push('<div class="stat-c" data-nav="forms"><div style="font-size:18px;font-weight:800;color:var(--blue)">'+((D.frm||[]).length)+'</div><div class="ps">استمارات</div></div>');
  // «المواعيد» بدل «المراجعون» — المراجعون موجود في شريط النقل، وعدد المواعيد القادمة أكثر إفادة هنا
  if(canAppts) statCells.push('<div class="stat-c" data-nav="appointments"><div style="font-size:18px;font-weight:800;color:var(--blue)">'+activeApts+'</div><div class="ps">مواعيد</div></div>');
  var stats = statCells.length
    ? '<div style="font-size:12px;font-weight:700;color:var(--mid);margin:14px 4px 8px">📊 إحصائيات عامة</div>'
      +'<div style="display:grid;grid-template-columns:repeat('+statCells.length+',1fr);gap:8px;margin-bottom:14px">'+statCells.join('')+'</div>'
    : '';

  var archiveBox = canArchive
    ? '<div data-nav="archive" style="background:linear-gradient(135deg,#fff,#f8fafc);border:1.5px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:all .18s" onmouseover="this.style.borderColor=\'var(--blue)\'" onmouseout="this.style.borderColor=\'var(--border)\'">'
      +'<div style="width:46px;height:46px;background:#f1f5f9;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px">🗄️</div>'
      +'<div style="flex:1"><div style="font-weight:800;font-size:15px">الأرشيف</div>'
      +'<div style="font-size:12px;color:var(--mid);margin-top:2px">المحادثات والاستمارات والمواعيد المؤرشفة</div></div>'
      +'<span style="font-size:20px;color:var(--mid)">←</span>'
      +'</div>'
    : '';

  $h('pg',
    '<div class="ph"><div><div class="pt">مرحباً '+((U&&U.name)||'')+'</div>'
    +'<div class="ps">نظرة عامة على النظام</div></div>'
    +'<button class="btn bd bsm" onclick="logout()">خروج</button></div>'
    + actionBoxes
    + '<div id="online-now"></div>'
    + stats
    + archiveBox);

  // حمّل قائمة المتصلين الآن (للإدارة فقط — لا يُكشف للمراجع)
  if(typeof loadOnlineNow==='function') loadOnlineNow();

  setTimeout(function(){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      el.style.cursor='pointer';
      el.onclick=function(){
        if(this.dataset.tab && this.dataset.nav==='forms'){
          window.FRM_TAB=this.dataset.tab;
        }
        gT(this.dataset.nav,null);
      };
    });
  },50);
}

async function loadOnlineNow(){
  if(!U || U.role!=='admin') return;
  var c=document.getElementById('online-now');
  if(c) c.innerHTML=_onlineSkeleton();
  var r;
  try{ r=await api('GET','presence?minutes=5'); }catch(e){ r=null; }
  if(!Array.isArray(r)){
    if(c) c.innerHTML=_onlineNotReady(r&&r.error);
    return;
  }
  renderOnlineNow(r);
}

function _onlineSkeleton(){

}

function _onlineNotReady(errMsg){

    +'<div style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mid);margin-bottom:6px">'

    +'</div>';

function renderOnlineNow(users){
  var c=document.getElementById('online-now');
  if(!c) return;
  // استبعد نفسي من القائمة
  var others=(users||[]).filter(function(u){return !U||+u.id!==+U.id;});
  if(!others.length){ c.innerHTML=_onlineEmpty(); return; }
  var reviewers=others.filter(function(u){return u.role==='reviewer';});
  var admins   =others.filter(function(u){return u.role==='admin';});

  function timeAgo(iso){
    if(!iso) return '';
    var ms=Date.now()-new Date(iso).getTime();
    var m=Math.floor(ms/60000);
    if(m<1) return 'الآن';
    if(m===1) return 'منذ دقيقة';
    if(m<5) return 'منذ '+m+' دقائق';
    return 'قبل قليل';
  }

  function row(u){
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid #f1f5f9">'
      +'<div style="position:relative;width:34px;height:34px;border-radius:50%;background:'+(u.role==='admin'?'#1a52b5':'var(--blue)')+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0">'
      +(u.name||'').charAt(0)
      +'<span style="position:absolute;bottom:-1px;left:-1px;width:11px;height:11px;background:#22c55e;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #22c55e"></span>'
      +'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-weight:700;font-size:13.5px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+htmlEsc(u.name||'مستخدم')+'</div>'
      +'<div style="font-size:11px;color:var(--mid);margin-top:1px">'
      +(u.role==='admin'?'مدير':'مراجع')+' • '+timeAgo(u.last_seen)
      +'</div></div>'
      +(u.role==='reviewer'?'<button class="btn bp bsm" style="padding:4px 10px;font-size:11px" onclick="oCht('+u.id+')">💬 محادثة</button>':'')
      +'</div>';
  }

  var h='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#f0fdf4,#fff);padding:10px 13px;border-bottom:1px solid #f1f5f9">'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 4px rgba(34,197,94,.2);animation:onlinePulse 2s infinite"></span>'
    +'<span style="font-weight:800;font-size:13px;color:#15803d">المتصلون الآن</span>'
    +'<span style="background:#15803d;color:#fff;font-size:10px;font-weight:800;padding:1px 8px;border-radius:10px">'+others.length+'</span>'
    +'</div>'
    +'<button onclick="loadOnlineNow()" style="background:transparent;border:none;cursor:pointer;font-size:14px;color:var(--mid)" title="تحديث">🔄</button>'
    +'</div>';
  if(reviewers.length){
    h+=reviewers.map(row).join('');
  }
  if(admins.length){
    h+='<div style="background:#f8fafc;padding:6px 13px;font-size:11px;color:var(--mid);font-weight:700">مدراء آخرون</div>';
    h+=admins.map(row).join('');
  }
  h+='</div>'
    +'<style>@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 4px rgba(34,197,94,.2)}50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}</style>';
  c.innerHTML=h;
}

async function oBld(fid){
  ld(1);const r=await api('GET','forms/'+fid);ld(0);
  BID=fid;
  const fields=r.fields||[];
  const cats=[...new Set(fields.map(f=>f.category||'عام'))];

function rCats(){
  const c=$g('cats-wrap');if(!c)return;
  c.innerHTML=BC.map((cat,ci)=>
    '<div class="cat-wrap" id="cw_'+ci+'">'
    +'<div class="cat-hdr" onclick="toggleCat('+ci+')">'
    +'<span>🗂️</span>'
    +'<input class="cat-name" value="'+cat.name+'" onclick="event.stopPropagation()" oninput="BC['+ci+'].name=this.value" placeholder="اسم التصنيف">'
    +'<div style="display:flex;gap:5px" onclick="event.stopPropagation()">'
    +'<button class="btn bp bsm" style="font-size:11px;padding:4px 10px" onclick="addField('+ci+')">+ حقل</button>'
    +'<button class="ib id" style="width:28px;height:28px" onclick="if(confirmDel(\'حذف التصنيف؟\'))delCat('+ci+')">'+SVG.del+'</button>'
    +'</div>'
    +'<span style="font-size:11px;color:var(--light);transition:transform .2s"'+(cat.open?' class="cat-arrow open"':' class="cat-arrow"')+'>▼</span>'
    +'</div>'
    +'<div class="cat-body'+(cat.open?' open':'')+'"><div id="flds_'+ci+'">'
    +(cat.fields.length?'':'<div style="text-align:center;color:var(--light);padding:14px;font-size:13px">لا توجد حقول</div>')
    +'</div></div></div>').join('');
  BC.forEach((cat,ci)=>{const c2=$g('flds_'+ci);if(c2)c2.innerHTML=cat.fields.length?rFields(cat.fields,ci):'<div style="text-align:center;color:var(--light);padding:14px;font-size:13px">لا توجد حقول — اضغط "+ حقل"</div>';});
  attachFldEvents();
}

      optsHtml='<div class="opt-list-wrap">';

      optsHtml+='<button type="button" style="padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font-family:Cairo,sans-serif;font-size:11px;cursor:pointer" data-addopt="1" data-ci="'+ci+'" data-fi="'+fi+'">+ خيار</button>';
      optsHtml+='</div>';

      opts.forEach(function(opt,oi){
        var ol=typeof opt==='object'?(opt.label||''):String(opt);
        var hasSub=opt.has_sub===true||opt.has_sub===1;
        var sub=opt.sub||{type:'text',label:'',placeholder:'',required:false};
        var subTypes=[['text','نص'],['number','رقم'],['textarea','طويل'],['date','تاريخ'],['phone','جوال']].map(function(t){
          return '<option value="'+t[0]+'"'+(sub.type===t[0]?' selected':'')+'>'+t[1]+'</option>';
        }).join('');
        var tbg=hasSub?'var(--blue)':'#cbd5e1';
        var tleft=hasSub?'21px':'3px';

        optsHtml+='<div class="opt-row">';

        optsHtml+='<div class="opt-row-head">';
        optsHtml+='<span style="font-size:10px;color:var(--light);flex-shrink:0">'+String.fromCharCode(9679)+'</span>';
        optsHtml+='<input id="opt_'+ci+'_'+fi+'_'+oi+'" class="opt-inp" style="flex:1;padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-family:Cairo,sans-serif;font-size:13px;outline:none" placeholder="نص الخيار" value="'+ol.replace(/"/g,'&quot;')+'">';
        optsHtml+='<button class="ib id" style="width:24px;height:24px;font-size:12px;flex-shrink:0" data-ci="'+ci+'" data-fi="'+fi+'" data-oi="'+oi+'" data-delopt="1">✕</button>';
        optsHtml+='</div>';

        optsHtml+='<div class="opt-row-toggle">';
        optsHtml+='<span>يفتح حقل توضيحي عند اختياره</span>';
        optsHtml+='<button id="subtog_'+ci+'_'+fi+'_'+oi+'" class="tog" data-ci="'+ci+'" data-fi="'+fi+'" data-oi="'+oi+'" data-subtog="1" style="background:'+tbg+'" data-v="'+(hasSub?'1':'0')+'">'
          +'<div class="tok" style="left:'+tleft+'"></div></button>';
        optsHtml+='</div>';

        optsHtml+='<div id="sub_'+ci+'_'+fi+'_'+oi+'" class="opt-row-sub" style="display:'+(hasSub?'block':'none')+'">';
        optsHtml+='<div class="opt-sub-grid">';
        optsHtml+='<div class="f-item"><label>نوع التوضيح</label><select id="subtype_'+ci+'_'+fi+'_'+oi+'">'+subTypes+'</select></div>';
        optsHtml+='<div class="f-item"><label style="padding-top:12px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="subrq_'+ci+'_'+fi+'_'+oi+'" style="width:14px;height:14px;accent-color:var(--blue)"'+(sub.required?' checked':'')+'> إجباري</label></div>';
        optsHtml+='</div>';
        optsHtml+='<div class="f-item" style="margin-top:6px"><label>عنوان الحقل</label>'
          +'<input id="sublbl_'+ci+'_'+fi+'_'+oi+'" class="opt-inp" style="width:100%;padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-family:Cairo,sans-serif;font-size:12px;outline:none" placeholder="مثال: كم القراءة؟" value="'+(sub.label||'').replace(/"/g,'&quot;')+'"></div>';
        optsHtml+='<div class="f-item" style="margin-top:6px"><label>Placeholder</label>'
          +'<input id="subph_'+ci+'_'+fi+'_'+oi+'" class="opt-inp" style="width:100%;padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-family:Cairo,sans-serif;font-size:12px;outline:none" placeholder="مثال: اكتب القيمة..." value="'+(sub.placeholder||'').replace(/"/g,'&quot;')+'"></div>';
        optsHtml+='</div>';
        optsHtml+='</div>';
      });
      optsHtml+='</div>';
    }

    return '<div class="fr" id="fr_'+ci+'_'+fi+'">'
      +'<div class="fr-row">'
      +'<span style="cursor:grab;color:#94a3b8;font-size:15px;flex-shrink:0">⠿</span>'
      +'<input id="lbl_'+ci+'_'+fi+'" class="fr-inp" style="flex:1;min-width:70px" placeholder="التسمية *" value="'+(f.label||'').replace(/"/g,'&quot;')+'">'
      +'<select id="tp_'+ci+'_'+fi+'" class="fr-sel" style="min-width:95px" onchange="onFldTypeChange('+ci+','+fi+',this.value)">'+ftypes+'</select>'
      +'<label style="display:flex;align-items:center;gap:3px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0">'
      +'<input id="rq_'+ci+'_'+fi+'" type="checkbox"'+(f.required?' checked':'')+' style="width:13px;height:13px;accent-color:var(--blue)"> إلزامي</label>'

      +'<input id="ph_'+ci+'_'+fi+'" class="fr-inp" style="color:#64748b;font-size:12px" placeholder="Placeholder..." value="'+(f.placeholder||'').replace(/"/g,'&quot;')+'">'
      +'<div style="display:flex;align-items:center;gap:4px;padding:4px 6px;background:#f8fafd;border-radius:6px">'
      +'<span style="font-size:10px;color:var(--light);white-space:nowrap">يظهر عند:</span>'
      +'<input id="cf_'+ci+'_'+fi+'" class="fr-inp" style="flex:2;min-width:55px;font-size:11px;padding:4px 7px" placeholder="حقل آخر" value="'+(f.conditional_field||'')+'">'
      +'<span style="font-size:10px;color:var(--light)">=</span>'
      +'<input id="cv_'+ci+'_'+fi+'" class="fr-inp" style="flex:1;min-width:40px;font-size:11px;padding:4px 7px" placeholder="القيمة" value="'+(f.conditional_value||'')+'">'
      +'</div>'
      +optsHtml
      +'</div>';
  }).join('');
}

function onFldTypeChange(ci,fi,type){
  var f=BC[ci].fields[fi];
  f.field_type=type;
  var hasOpts=['select','radio','checkbox'].includes(type);
  if(hasOpts&&(!f.options||!f.options.length)){
    f.options=[
      {label:'نعم',has_sub:false,sub:{type:'text',label:'',placeholder:'',required:false}},
      {label:'لا', has_sub:false,sub:{type:'text',label:'',placeholder:'',required:false}}
    ];
  }
  rCats();
}

function addField(ci){
  if(!BC[ci])return;
  BC[ci].fields.push({
    id:null,label:'',field_type:'text',required:0,
    placeholder:'',conditional_field:'',conditional_value:'',options:[]
  });
  BC[ci].open=true;
  rCats();

  setTimeout(function(){
    var c=$g('cats-wrap');
    if(c)c.querySelector('#flds_'+ci+' .fr:last-child')?.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}

function delField(ci,fi){
  if(BC[ci]&&BC[ci].fields)BC[ci].fields.splice(fi,1);
  rCats();
}

function addCat(){
  BC.push({name:'تصنيف جديد',open:true,fields:[]});
  rCats();
  setTimeout(function(){
    var c=$g('cats-wrap');
    if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}

function delCat(ci){
  BC.splice(ci,1);
  rCats();
}

function toggleCat(ci){
  if(BC[ci])BC[ci].open=!BC[ci].open;
  rCats();
}


function saveCurrentInputs(){
  // حفظ قيم الحقول الحالية في BC قبل إعادة الرسم
  BC.forEach(function(cat,ci){
    cat.fields.forEach(function(f,fi){
      var lbl=$g('lbl_'+ci+'_'+fi);if(lbl)f.label=lbl.value;
      var ph=$g('ph_'+ci+'_'+fi);if(ph)f.placeholder=ph.value;
      var tp=$g('tp_'+ci+'_'+fi);if(tp)f.field_type=tp.value;
      var rq=$g('rq_'+ci+'_'+fi);if(rq)f.required=rq.checked?1:0;
      var cf=$g('cf_'+ci+'_'+fi);if(cf)f.conditional_field=cf.value;
      var cv=$g('cv_'+ci+'_'+fi);if(cv)f.conditional_value=cv.value;
      // حفظ الخيارات
      if(f.options){
        f.options.forEach(function(opt,oi){
          var ol=$g('opt_'+ci+'_'+fi+'_'+oi);if(ol)opt.label=ol.value;
          var sl=$g('sublbl_'+ci+'_'+fi+'_'+oi);if(sl)opt.sub.label=sl.value;
          var sp=$g('subph_'+ci+'_'+fi+'_'+oi);if(sp)opt.sub.placeholder=sp.value;
          var st=$g('subtype_'+ci+'_'+fi+'_'+oi);if(st)opt.sub.type=st.value;
          var sr=$g('subrq_'+ci+'_'+fi+'_'+oi);if(sr)opt.sub.required=sr.checked;
        });
      }
    });
  });
}

function attachFldEvents(){

  document.querySelectorAll('[data-del="1"]').forEach(function(btn){
    btn.onclick=function(){if(confirmDel('حذف الحقل؟'))delField(+btn.dataset.ci,+btn.dataset.fi);};
  });

  document.querySelectorAll('[data-delopt="1"]').forEach(function(btn){
    btn.onclick=function(){
      var ci=+btn.dataset.ci,fi=+btn.dataset.fi,oi=+btn.dataset.oi;
      if(BC[ci]&&BC[ci].fields[fi]&&BC[ci].fields[fi].options){
        saveCurrentInputs();
        BC[ci].fields[fi].options.splice(oi,1);rCats();
      }
    };
  });

  document.querySelectorAll('[data-addopt="1"]').forEach(function(btn){
    btn.onclick=function(){
      var ci=+btn.dataset.ci,fi=+btn.dataset.fi;
      if(!BC[ci].fields[fi].options)BC[ci].fields[fi].options=[];
      BC[ci].fields[fi].options.push({label:'خيار جديد',has_sub:false,sub:{type:'text',label:'',placeholder:'',required:false}});
      rCats();
    };
  });

  document.querySelectorAll('[data-subtog="1"]').forEach(function(btn){
    btn.onclick=function(){
      var ci=+btn.dataset.ci,fi=+btn.dataset.fi,oi=+btn.dataset.oi;
      var nv=btn.dataset.v==='1'?false:true;
      btn.dataset.v=nv?'1':'0';
      btn.style.background=nv?'var(--blue)':'#cbd5e1';

      var tok=btn.querySelector('.tok');
      if(tok)tok.style.left=nv?'21px':'3px';
      var subBox=document.getElementById('sub_'+ci+'_'+fi+'_'+oi);
      if(subBox)subBox.style.display=nv?'block':'none';
      if(BC[ci]&&BC[ci].fields[fi]&&BC[ci].fields[fi].options[oi]){
        BC[ci].fields[fi].options[oi].has_sub=nv;
      }
    };
  });
}

function readOptsFromDOM(ci,fi,f){
  var ft=$g('tp_'+ci+'_'+fi)?.value||f.field_type;
  if(!['select','radio','checkbox'].includes(ft))return null;
  var opts=f.options||[];
  return opts.map(function(opt,oi){
    return {
      label:$g('opt_'+ci+'_'+fi+'_'+oi)?.value||opt.label||'',
      has_sub:$g('subtog_'+ci+'_'+fi+'_'+oi)?.dataset.v==='1'||false,
      sub:{
        type:$g('subtype_'+ci+'_'+fi+'_'+oi)?.value||opt.sub?.type||'text',
        label:$g('sublbl_'+ci+'_'+fi+'_'+oi)?.value||opt.sub?.label||'',
        placeholder:$g('subph_'+ci+'_'+fi+'_'+oi)?.value||opt.sub?.placeholder||'',
        required:$g('subrq_'+ci+'_'+fi+'_'+oi)?.checked||false
      }
    };
  });
}

async function svBld(){
  var t=($g('bt')?.value||'').trim();if(!t){toast('العنوان مطلوب','er');$g('bt')?.focus();return;}
  var allF=[];
  BC.forEach(function(cat,ci){
    cat.fields.forEach(function(f,fi){
      var opts=readOptsFromDOM(ci,fi,f);
      allF.push({
        id:f.id||null,
        label:$g('lbl_'+ci+'_'+fi)?.value||f.label,
        placeholder:$g('ph_'+ci+'_'+fi)?.value||(f.placeholder||''),
        field_type:$g('tp_'+ci+'_'+fi)?.value||f.field_type,
        required:$g('rq_'+ci+'_'+fi)?.checked?1:0,
        category:cat.name,sort_order:ci*100+fi,
        conditional_field:$g('cf_'+ci+'_'+fi)?.value||null,
        conditional_value:$g('cv_'+ci+'_'+fi)?.value||null,
        options:opts
      });
    });
  });
  ld(1);
  var r=await api('PUT','forms/'+BID,{title:t,section_id:+$g('bsc')?.value||null,status:$g('bst')?.value||'draft',subtitle:'',fields:allF});
  ld(0);
  if(r.error){toast(r.error,'er');return;}
  toast('تم حفظ الاستمارة ✅');await lFrm();gT('forms');
}

function pvSubFromEl(el){
  var fldId=el.dataset.pvid;
  var opts=JSON.parse(decodeURIComponent(el.dataset.pvopts||'[]'));
  pvApplySub(fldId,opts,el.value);
}
function pvApplySub(fldId,opts,selectedVal){
  var subWrap=document.getElementById('pvsub_'+fldId);
  if(!subWrap)return;
  subWrap.innerHTML='';
  var selVals=selectedVal?[selectedVal]:[];
  if(!selVals.length){
    var ch=document.querySelector('[name="'+fldId+'"]:checked');
    if(ch)selVals=[ch.value];
    var sel=document.getElementById(fldId);
    if(sel&&sel.value)selVals=[sel.value];
  }
  opts.forEach(function(opt,oi){
    var ol=typeof opt==='object'?opt.label:opt;
    var sub=typeof opt==='object'?opt.sub:null;
    if(!selVals.includes(ol)||!sub||!opt.has_sub||!sub.label)return;
    var BASE='width:100%;padding:9px 12px;border:1.5px solid var(--blue);border-radius:9px;font-family:Cairo,sans-serif;font-size:14px;outline:none;margin-top:6px';
    var t2=sub.type==='number'?'number':sub.type==='date'?'date':sub.type==='phone'?'tel':'text';
    subWrap.innerHTML+='<div style="background:#f0f6ff;border-radius:9px;padding:10px;border:1px solid #bfdbfe;margin-top:6px">'
      +'<label style="font-size:12px;font-weight:700;color:var(--blue2)">↳ '+sub.label+'</label>'
      +(sub.type==='textarea'?'<textarea placeholder="'+(sub.placeholder||'')+'" style="'+BASE+';height:70px;resize:none"></textarea>'
        :'<input type="'+t2+'" placeholder="'+(sub.placeholder||'')+'" style="'+BASE+'">')
      +'</div>';
  });
}

function pvRadioChange(inp){
  var name=inp.name;

  document.querySelectorAll('[name="'+name+'"]').forEach(function(r){
    if(r.dataset.subid){
      var box=document.getElementById(r.dataset.subid);
      if(box)box.style.display='none';
    }
    if(r.dataset.wrapid){
      var w=document.getElementById(r.dataset.wrapid);
      if(w)w.classList.remove('has-sub-open');
    }
  });

  if(inp.checked&&inp.dataset.hassub==='1'&&inp.dataset.subid){
    var myBox=document.getElementById(inp.dataset.subid);
    if(myBox){
      myBox.style.display='block';
      var fi=myBox.querySelector('input,textarea');
      if(fi)setTimeout(function(){fi.focus();},80);
    }
    if(inp.dataset.wrapid){
      var w2=document.getElementById(inp.dataset.wrapid);
      if(w2)w2.classList.add('has-sub-open');
    }
  }
}

function pvCheckChange(chk){
  if(chk.dataset.subid){
    var box=document.getElementById(chk.dataset.subid);
    if(box)box.style.display=chk.checked?'block':'none';
  }
  if(chk.dataset.wrapid){
    var w=document.getElementById(chk.dataset.wrapid);
    if(w)w.classList.toggle('has-sub-open',chk.checked);
  }
}

function pvHandleRadio(inp){pvRadioChange(inp);}

function pvHandleSelect(sel){

function pvShowSub(fieldDbId, selectedVal, subWrapId){
  var subWrap=document.getElementById(subWrapId);
  if(!subWrap)return;
  subWrap.innerHTML='';
  if(!selectedVal)return;

  var fields=window._pvFields||[];
  var f=fields.find(function(x){return String(x.id)===String(fieldDbId);});
  if(!f||!f.options)return;

  var opts=f.options;
  opts.forEach(function(opt){
    if(typeof opt!=='object'||!opt.has_sub)return;
    var ol=opt.label||'';
    if(ol!==selectedVal)return;
    var sub=opt.sub||{};
    if(!sub.label)return;
    var INP2='width:100%;padding:10px 12px;border:1.5px solid var(--blue);border-radius:9px;font-family:Cairo,sans-serif;font-size:14px;outline:none;background:#fff;margin-top:6px';
    var t2=sub.type==='number'?'number':sub.type==='date'?'date':sub.type==='phone'?'tel':'text';

      +'<label style="display:block;font-size:12px;font-weight:700;color:var(--blue2);margin-bottom:5px">↳ '+sub.label+(sub.required?'<span style="color:var(--red)"> *</span>':'')+'</label>'

}

var APT_CAL_DATE = new Date();
function rAptCalendar(){
  var c=$g('ab');if(!c)return;
  var y=APT_CAL_DATE.getFullYear();
  var m=APT_CAL_DATE.getMonth();
  var today=new Date().toISOString().slice(0,10);
  var AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var AR_DAYS=['أح','إث','ثل','أر','خم','جم','سب'];
  var firstDay=new Date(y,m,1).getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var h='';

  // ناف مضغوط للجوال
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:#fff;padding:10px 12px;border-radius:12px;border:1px solid var(--border)">';
  h+='<button style="background:var(--blue-bg);border:none;color:var(--blue);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px;font-weight:700" data-calmove="-1">‹</button>';
  h+='<div style="font-weight:800;font-size:15px">'+AR_MONTHS[m]+' '+y+'</div>';
  h+='<button style="background:var(--blue-bg);border:none;color:var(--blue);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px;font-weight:700" data-calmove="1">›</button>';
  h+='</div>';

  // رؤوس الأيام
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px">';
  AR_DAYS.forEach(function(d){
    h+='<div style="text-align:center;font-size:10px;font-weight:700;color:var(--mid);padding:4px 0">'+d+'</div>';
  });
  h+='</div>';

  // خلايا التقويم
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px">';
  for(var i=0;i<firstDay;i++) h+='<div></div>';
  for(var d2=1;d2<=daysInMonth;d2++){
    var dateStr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    var isPast=dateStr<today;
    var isToday=dateStr===today;
    var daySlots=D.dts.filter(function(dt){return dt.date===dateStr;});
    var hasAvail=daySlots.some(function(s){return s.status==='available';});
    var hasBooked=daySlots.some(function(s){return s.status==='booked';});
    var hasPending=daySlots.some(function(s){return s.status==='pending';});

    var bg='#fff', border='var(--border)', numClr='var(--text)';
    if(isToday){bg='var(--blue-bg)';border='var(--blue)';}
    else if(hasBooked){bg='#eff6ff';}
    else if(hasPending){bg='#fffbeb';}
    else if(hasAvail){bg='#f0fdf4';}
    if(isPast){bg='#f9fafb';numClr='#cbd5e1';}

    var dot='';
    if(hasBooked) dot='<div style="width:5px;height:5px;border-radius:50%;background:#2563b0;margin:1px auto"></div>';
    else if(hasPending) dot='<div style="width:5px;height:5px;border-radius:50%;background:#d97706;margin:1px auto"></div>';
    else if(hasAvail) dot='<div style="width:5px;height:5px;border-radius:50%;background:#16a34a;margin:1px auto"></div>';

    h+='<div style="background:'+bg+';border:1.5px solid '+border+';border-radius:8px;padding:4px 2px;text-align:center;min-height:42px;cursor:'+(isPast?'default':'pointer')
      +'" data-calday="'+dateStr+'">';
    h+='<div style="font-size:12px;font-weight:700;color:'+numClr+'">'+d2+'</div>';
    h+=dot;
    h+='</div>';
  }
  h+='</div>';

  // أزرار الإضافة
  h+='<div style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap">';
  h+='<button class="btn bp bsm" data-adddt="1">+ يوم</button>';
  h+='<button class="btn bs bsm" data-addbtch="1">📅 دفعة</button>';
  h+='<button style="padding:5px 12px;border-radius:9px;border:none;background:#fdf4ff;color:#9333ea;font-family:Cairo,sans-serif;font-size:12px;font-weight:700;cursor:pointer" data-addexc="1">⭐ استثنائي</button>';
  h+='</div>';

  h+='<div id="apt-day-detail"></div>';
  c.innerHTML=h;

  // ربط الأحداث
  c.querySelectorAll('[data-calmove]').forEach(function(btn){
    btn.addEventListener('click',function(){aptCalMove(+btn.dataset.calmove);});
  });
  c.querySelectorAll('[data-calday]').forEach(function(el){
    el.addEventListener('click',function(){aptCalDayClick(el.dataset.calday);});
  });
  c.querySelector('[data-adddt]')?.addEventListener('click',function(){oDt();});
  c.querySelector('[data-addbtch]')?.addEventListener('click',function(){oDtBatch();});
  c.querySelector('[data-addexc]')?.addEventListener('click',function(){oExceptional();});
}

      h+='<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">';
      if(s.status==='available') h+='<button class="btn bs bsm" data-tdt="'+s.id+'" data-tdtst="locked">🔒 إغلاق</button>';
      if(s.status==='locked') h+='<button class="btn bs bsm" data-tdt="'+s.id+'" data-tdtst="available">🔓 فتح</button>';
      if(apt&&apt.status==='pending') h+='<button class="btn bp bsm" data-uaptid="'+apt.id+'" data-uaptst="confirmed">✔ تأكيد</button>';
      if(apt&&['pending','confirmed'].includes(apt.status)) h+='<button class="btn bd bsm" data-uaptid="'+apt.id+'" data-uaptst="cancelled_admin">✕ إلغاء</button>';
      h+='<button class="ib id" style="width:28px;height:28px;font-size:13px" data-deldt="'+s.id+'">'+SVG.del+'</button>';
      h+='</div></div></div>';
    });
  }
  h+='</div>';
  dd.innerHTML=h;
  dd.scrollIntoView({behavior:'smooth',block:'nearest'});

    btn.addEventListener('click',function(){oDtFor(btn.dataset.dtfor);});

  dd.querySelectorAll('[data-closedd]').forEach(function(btn){
    btn.addEventListener('click',function(){dd.innerHTML='';});
  });

async function svDtBatch(){
  const sl=$g('dtsl')?.value,from=$g('dt-from')?.value,to=$g('dt-to')?.value;
  if(!sl||!from||!to){toast('أدخل جميع البيانات','er');return;}
  const days=[0,1,2,3,4,5,6].filter(i=>$g('dw'+i)?.checked);
  const dates=[];let cur=new Date(from);const end=new Date(to);
  while(cur<=end){if(days.includes(cur.getDay()))dates.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}
  if(!dates.length){toast('لا توجد أيام مطابقة','er');return;}
  ld(1);const r=await api('POST','dates',{slot_id:+sl,dates,status:'available'});ld(0);
  if(r.error){toast(r.error,'er');return;}
  toast('تمت إضافة '+dates.length+' يوم ✅');cM();await lDts();rAptContent();
}

/* ── CHAT ────────────────────────────────────────────────────── */
async function pCht(){
  // اعرض من cache فوراً — حدّث في الخلفية صامتاً (أسرع تنقّل)
  if(!D.cvs || !D.cvs.length){
    try{ await lCvs(); }catch(e){}
  } else {
    // تحديث صامت — re-render فقط لو تغيّر العدد غير المقروء
    var oldU=(D.cvs||[]).reduce(function(n,c){return n+(+c.unread||0);},0);
    lCvs().then(function(){
      var newU=(D.cvs||[]).reduce(function(n,c){return n+(+c.unread||0);},0);
      if(oldU!==newU && NAV==='chat') pCht();
    }).catch(function(){});
  }
  if(typeof window._checkUnread==='function') window._checkUnread();
  var cvs=D.cvs||[];
  var h='<div class="ph"><div><div class="pt">💬 المحادثات</div></div></div>';
  if(!cvs.length){
    h+='<div style="text-align:center;padding:60px 16px;color:var(--light)">'
      +'<div style="font-size:48px;margin-bottom:12px">💬</div>'
      +'<p>لا توجد محادثات</p></div>';
    $h('pg',h);return;
  }
  h+='<div class="cv-list">';
  cvs.forEach(function(c){

// ─── إشعارات الخلفية (شارة + عنوان التبويب) ─────────────────────
// poller خفيف يجلب عدد الرسائل غير المقروءة فقط (استعلام واحد) كل ١٥ ثانية.
// يُحدّث الشارة الحمراء على أيقونة المحادثة وعنوان التبويب: «(3) منصة خاصة».
window._unreadTmr=null;
window._unreadCount=0;

async function _checkUnread(){
  if(!TK||!U) return;
  try{
    var r=await api('GET','unread');
    if(r && typeof r.count==='number'){ _setUnreadBadge(r.count); }
  }catch(e){}
}

function _setUnreadBadge(count){
  var prev = +window._unreadCount || 0;
  window._unreadCount=count;
  // عنوان التبويب
  var baseName=(D.cfg && D.cfg.site_name) || 'منصة خاصة';
  document.title = count>0 ? '('+count+') '+baseName : baseName;
  // شارة على أيقونة المحادثة (شريط النقل للمدير والمراجع)
  ['bnav','rev-bnav'].forEach(function(cid){
    var nav=document.getElementById(cid); if(!nav) return;
    var chatBtn=nav.querySelector('[data-page="chat"]'); if(!chatBtn) return;
    var badge=chatBtn.querySelector('.bn-badge');
    if(count>0){
      if(!badge){
        badge=document.createElement('span');
        badge.className='bn-badge';
        chatBtn.appendChild(badge);
      }
      badge.textContent = count>99 ? '99+' : String(count);
    } else if(badge){
      badge.remove();
    }
  });
  // أعد رسم الصفحة الرئيسية لتعكس العدد الحيّ (لو المستخدم فيها الآن)
  if(prev !== count && U){
    if(U.role==='admin' && NAV==='home' && typeof pH==='function') pH();
    if(U.role==='reviewer' && RV_NAV==='home' && typeof rvHome==='function') rvHome();
  }
}

function _startUnreadPoll(){
  _stopUnreadPoll();
  _checkUnread(); // فحص فوري عند تسجيل الدخول
  window._unreadTmr=setInterval(_checkUnread, 15000);
}

function _stopUnreadPoll(){
  if(window._unreadTmr){ clearInterval(window._unreadTmr); window._unreadTmr=null; }
  _setUnreadBadge(0); // امسح الشارة عند الخروج
}

async function init(){
  const forceAdmin=(typeof location!=='undefined')&&new URLSearchParams(location.search).get('admin')==='1';
  // قبل أي شيء آخر — إذا الرابط فيه ?invite=TOKEN، اعرض شاشة تسجيل المدعو
  const inviteTok = (typeof location!=='undefined') && new URLSearchParams(location.search).get('invite');
  if(inviteTok){
    return shInvite(inviteTok);
  }

  // تحميل الإعدادات - إذا فشل اعرض login فوراً
  const cfgPromise = api('GET','settings');
  // لا ننتظر settings لعرض login - نعرضه بعد 2 ثانية إذا لم يرد
  let settingsDone = false;
  const settingsFallback = setTimeout(function(){
    if(!settingsDone){
      console.warn('settings timeout - showing login');
      if(!TK) shAuth(forceAdmin);
    }
  }, 2000);
  
  try{
    const cfg = await cfgPromise;
    if(cfg&&!cfg.error) D.cfg=cfg;
  }catch(e){}
  settingsDone = true;
  clearTimeout(settingsFallback);

  if(TK){
    // 1) تحقّق من صلاحية الـ JWT محلياً (signature لا نتحقق منها — يفعلها السيرفر)
    let validJwt=false, pl=null;
    try{
      const parts=TK.split('.');
      if(parts.length===3){
        pl=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
        if(pl.exp>Date.now()/1000) validJwt=true;
      }
    }catch(ex){ console.log('JWT parse error:',ex); }

    if(validJwt && pl){
      // 2) جرّب /me مرّتين (لتفادي خروج المستخدم بسبب أخطاء شبكة عابرة)
      let me=null;
      for(let i=0;i<2;i++){
        me=await api('GET','me');
        if(me&&me.id&&!me.error) break;
        // 401 أو "غير مصرح" = token مرفوض — لا نعيد المحاولة
        if(me&&me.error&&/غير مصرح|401|invalid|expired/i.test(me.error)) break;
        // غير ذلك = خطأ شبكة عابر — انتظر نصف ثانية وأعد المحاولة
        await new Promise(r=>setTimeout(r,500));
      }

      if(me&&me.id&&!me.error){
        // 3) تطابق الدور: لو JWT يقول admin والـ DB يقول reviewer (أو العكس)
        // أَجبر إعادة تسجيل الدخول لتحديث الـ JWT — هذا يمنع ظهور
        // ترويسة المدير على صفحة المراجع.
        if(me.role && pl.role && me.role!==pl.role){
          console.warn('JWT/DB role mismatch — forcing re-login. JWT='+pl.role+', DB='+me.role);
          TK=null; localStorage.removeItem('tk');
          shAuth(forceAdmin);
          return;
        }
        U=Object.assign({},me,{role:pl.role});
        if(pl.role==='admin'){ await shDash(); return; }
        else if(pl.role==='inviter'){ await shInviter(); return; }
        else { await shRev(); return; }
      }

      // /me فشل بشكل واضح من السيرفر (token مرفوض) — احذفه
      if(me&&me.error&&/غير مصرح|401|invalid|expired/i.test(me.error)){
        TK=null; localStorage.removeItem('tk');
      }
      // خطأ شبكة عابر — لا تحذف الـ token، فقط أظهر شاشة الدخول
      // ليُعيد المستخدم المحاولة دون فقد الجلسة
    } else {
      // الـ JWT غير صالح محلياً (انتهت صلاحيته أو تالف)
      TK=null; localStorage.removeItem('tk');
    }
  }
  shAuth(forceAdmin);
}

  var chatFn = (U && U.role==='inviter' && typeof pInviterChat==='function') ? pInviterChat : rvChat;

  var fn=fns[p];
  if(fn){

    if(p==='profile' && typeof rvNeedsProfile==='function' && rvNeedsProfile() && typeof rvShowProfileForm==='function'){

    }
    fn();
  }
  else rvHome();

function rvHome(){

  h+='<div style="background:linear-gradient(135deg,#1a2e52,#2a6fdb);border-radius:16px;padding:18px;color:#fff;margin-bottom:14px">';

  h+='<div style="font-size:12px;opacity:.8">لوحة متابعتك الشخصية</div></div>';

  // الاستمارات المرشحة
  var myForms=D.frm.filter(function(f){return f.status==='active';});

/* ── إرسال الاستمارة ── */
async function rvSubmitForm(fid){
  var fields=window._rv_current_fields||[];
  var answers=[];
  var errors=[];

  fields.forEach(function(f){
    var fid2='ans_'+f.id;
    var val='';
    if(f.field_type==='radio'){
      var sel=document.querySelector('[name="'+fid2+'"]:checked');
      val=sel?sel.value:'';
    } else if(f.field_type==='checkbox'){
      var checked=[];
      var opts=Array.isArray(f.options)?f.options:[];
      opts.forEach(function(o,oi){
        var cb=$g(fid2+'_cb_'+oi);
        if(cb&&cb.checked) checked.push(typeof o==='object'?(o.label||''):String(o));
      });
      val=checked.join('، ');
    } else {
      var el=$g(fid2);
      val=el?el.value:'';
    }
    if(f.required&&!String(val).trim()){
      errors.push(f.label);
    }
    if(val) answers.push({field_id:f.id,answer:String(val)});
  });

  if(errors.length){
    // تمييز الحقول الفارغة بالأحمر
    fields.forEach(function(f){
      if(errors.includes(f.label)){
        var el=$g('ans_'+f.id);
        if(el){
          el.style.borderColor='#ef4444';
          el.style.background='#fff5f5';
          setTimeout(function(){
            el.style.borderColor='';
            el.style.background='';
          },3000);
        }
        // تمييز radio/checkbox
        var wrap=$g('wrap_ans_'+f.id+'_0')||document.querySelector('[name="ans_'+f.id+'"]');
        if(wrap){
          var parent=wrap.closest('div');
          if(parent){
            parent.style.border='2px solid #ef4444';
            parent.style.borderRadius='8px';
            parent.style.padding='6px';
            setTimeout(function(){parent.style.border='';parent.style.padding='';},3000);
          }
        }
      }
    });
    toast('⚠️ يرجى تعبئة: '+errors.join('، '),'er');
    // التمرير للحقل الأول الفارغ
    var firstErr=errors[0];
    var firstField=fields.find(function(f){return f.label===firstErr;});
    if(firstField){
      var el2=$g('ans_'+firstField.id);
      if(el2) el2.scrollIntoView({behavior:'smooth',block:'center'});
    }
    return;
  }
  if(!answers.length){toast('لا توجد إجابات','er');return;}
  if(!confirm('بعد الإرسال لا يمكن التعديل. هل تريد الإرسال؟'))return;

  ld(1);
  var r=await api('POST','submissions',{form_id:fid,answers:answers});
  ld(0);
  if(r.error){toast(r.error,'er');return;}
  toast('✅ تم إرسال الاستمارة بنجاح');
  await lSub();
  rvHome();
}

/* ══ HIGHLIGHT FUNCTIONS ══ */
var _hlBar=null;
var _hlSel=null;

function hlInit(containerId){
  var box=document.getElementById(containerId);
  if(!box)return;
  box.addEventListener('mouseup',hlOnSelect);
  box.addEventListener('touchend',function(){setTimeout(hlOnSelect,100);});
}

function hlOnSelect(){
  var sel=window.getSelection?window.getSelection():null;
  if(!sel||sel.isCollapsed||!sel.rangeCount){
    hlHideBar();return;
  }
  var txt=sel.toString().trim();
  if(!txt){hlHideBar();return;}
  _hlSel=sel;
  hlShowBar();
}

function hlShowBar(){
  var bar=document.getElementById('hl-bar');
  if(bar) bar.classList.add('show');
}

function hlHideBar(){
  var bar=document.getElementById('hl-bar');
  if(bar) bar.classList.remove('show');
  _hlSel=null;
}

function hlApply(cls){
  var sel=window.getSelection?window.getSelection():_hlSel;
  if(!sel||sel.isCollapsed){hlHideBar();return;}
  try{
    var range=sel.getRangeAt(0);
    // إزالة تمييز سابق إذا وجد
    var span=document.createElement('span');
    span.className=cls;
    range.surroundContents(span);
    sel.removeAllRanges();
  }catch(e){
    // في حال اختيار عبر عناصر متعددة
    try{
      document.execCommand('bold',false,null);
    }catch(e2){}
  }
  hlHideBar();
}

function hlClear(){
  var sel=window.getSelection?window.getSelection():_hlSel;
  if(!sel||sel.isCollapsed){hlHideBar();return;}
  try{
    var range=sel.getRangeAt(0);
    var frag=range.extractContents();
    // إزالة كل spans التمييز
    var spans=frag.querySelectorAll('.hl-y,.hl-g,.hl-b,.hl-r,.hl-p,.hl-bold-txt');
    spans.forEach(function(sp){
      var parent=sp.parentNode;
      while(sp.firstChild)parent.insertBefore(sp.firstChild,sp);
      parent.removeChild(sp);
    });
    range.insertNode(frag);
    sel.removeAllRanges();
  }catch(e){}
  hlHideBar();
}

// إخفاء الشريط عند النقر خارجه
document.addEventListener('mousedown',function(e){
  var bar=document.getElementById('hl-bar');
  if(bar&&!bar.contains(e.target)) hlHideBar();
});

async function viewArchivedChat(tid){
  ld(1);
  var r=await api('GET','threads/'+tid);
  ld(0);
  var msgs=Array.isArray(r)?r:(r&&r.messages?r.messages:[]);
  
  // جلب بيانات الـ thread
  var threads=await api('GET','archive_chats');
  var thread=(Array.isArray(threads)?threads:[]).find(function(t){return +t.id===+tid;})||{};
  var name=thread.reviewer_name||'مراجع';
  var title=thread.title||'محادثة';

  var h='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';
  h+='<button class="btn bs bsm" onclick="pArchiveChats()">← رجوع</button>';
  h+='<div style="flex:1">';
  h+='<div style="font-weight:800;font-size:15px">'+htmlEsc(name)+'</div>';
  h+='<div style="font-size:12px;color:#0369a1;font-weight:600">📌 '+htmlEsc(title)+'</div>';
  h+='</div>';
  h+='<button class="btn bp bsm" onclick="restoreChat('+tid+')">↩️ استعادة</button>';
  h+='</div>';

  if(!msgs.length){
    h+='<div style="text-align:center;padding:30px;color:var(--light)">لا توجد رسائل</div>';
    $h('pg',h);return;
  }

  var today=new Date().toISOString().slice(0,10),ld2='';
  msgs.forEach(function(m){
    var d=(m.created_at||'').slice(0,10),t=(m.created_at||'').slice(11,16);
    if(d&&d!==ld2){h+='<div style="text-align:center;margin:8px 0"><span style="background:rgba(0,0,0,.1);color:#54656f;font-size:11px;padding:3px 10px;border-radius:8px">'+(d===today?'اليوم':d)+'</span></div>';ld2=d;}
    var isAdmin=m.from_name&&(m.from_role==='admin'||+m.from_id!==+thread.reviewer_id);
    var bd=htmlEsc(m.body||'');
    if(isAdmin){
      h+='<div style="display:flex;justify-content:flex-end;padding:1px 4px;margin-bottom:1px"><div style="background:#d9f7be;border-radius:0 12px 12px 12px;padding:6px 10px 4px;max-width:75%;box-shadow:0 1px 2px rgba(0,0,0,.1)">';
      h+='<div style="font-size:14px;color:#111">'+bd+'</div>';
      h+='<div style="font-size:10.5px;color:rgba(0,0,0,.4);text-align:left;margin-top:2px">'+t+'</div></div></div>';
    } else {
      h+='<div style="display:flex;padding:1px 4px;margin-bottom:1px"><div style="background:#fff;border-radius:12px 0 12px 12px;padding:6px 10px 4px;max-width:75%;box-shadow:0 1px 2px rgba(0,0,0,.1)">';
      h+='<div style="font-size:14px;color:#111">'+bd+'</div>';
      h+='<div style="font-size:10.5px;color:rgba(0,0,0,.4);text-align:left;margin-top:2px">'+t+'</div></div></div>';
    }
  });

  $h('pg',h);
}

  });
  $h('pg',h);
}
async function archiveApt(id){
  if(!confirm('أرشفة هذا الموعد؟\nلا يمكن استعادته.'))return;
  ld(1);
  var r=await api('PUT','appointments/'+id,{status:'archived'});
  ld(0);
  if(r&&r.ok){
    toast('✅ تم الأرشفة');
    await lApt();
    pApt();
  } else {
    toast((r&&r.error)||'فشل','er');
  }
}
