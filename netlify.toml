# إعداد نشر منصّة alaoufi على Netlify (تشغّل Next.js وخدماته الخادمية عبر الـ Runtime الرسمي).
# لا يؤثّر على النشر الحالي على فيرسل — ملفٌ يقرؤه Netlify وحده.
[build]
  command = "next build"
  publish = ".next"

# Runtime الرسمي لـ Next.js على Netlify — يحوّل مسارات app/api والـ SSR والـ rewrites تلقائياً.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

# تحويل جذر الدومين إلى واجهة المفرجي (Netlify لا يطبّق rewrite الجذر من next.config)
# from='/' يطابق الجذر فقط، فلا يؤثر على /con أو /notes أو بقية المسارات.
[[redirects]]
  from = "/"
  to = "/almfrje/"
  status = 301
  force = true
